
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex - Módulo 3</title>
    <script src="https://cdn.tailwindcss.com"></script>

    
<style>

/* Contenedor de la Pokebola */
.pokebola {
    position: relative;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    overflow: hidden;
    border: 4px solid #1e293b;
    background: white;
}

/* Parte superior roja */
.pokebola-superior {
    position: absolute;
    top: 0;
    width: 100%;
    height: 50%;
    background: #ef4444;
}

/* Parte inferior blanca */
.pokebola-inferior {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 50%;
    background: white;
}

/* Línea negra central */
.pokebola-linea {
    position: absolute;
    top: 50%;
    width: 100%;
    height: 8px;
    background: #1e293b;
    transform: translateY(-50%);
}

/* Botón central */
.pokebola-centro {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 25px;
    height: 25px;
    background: white;
    border: 5px solid #1e293b;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
}

/* Animación de captura */
.animar-captura {
    animation: capturaPokemon 2.5s ease-in-out forwards;
}

@keyframes capturaPokemon {

    0% {
        transform: translateY(-100px) rotate(-30deg) scale(0.5);
        opacity: 0;
    }

    20% {
        transform: translateY(0) rotate(0deg) scale(1.2);
        opacity: 1;
    }

    35%, 45%, 55% {
        transform: rotate(-12deg);
    }

    40%, 50%, 60% {
        transform: rotate(12deg);
    }

    70% {
        transform: rotate(0deg) scale(1);
    }

    85% {
        transform: scale(1.15);
    }

    100% {
        transform: scale(1);
    }

}

</style>

</head>

<body class="bg-slate-100 min-h-screen p-6">

    <main class="max-w-6xl mx-auto">

        <h1 class="text-3xl font-bold text-center text-slate-800 mb-6">
            Pokédex
        </h1>

        <!-- Buscador -->
        <div class="max-w-md mx-auto flex gap-2 mb-6">

            <input
                id="buscador"
                type="text"
                placeholder="Busca por nombre o numero (Ej. pikachu o 25)"
                class="flex-1 p-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white shadow-sm"
            >

            <button
                id="btn-buscar"
                class="px-4 py-2 bg-yellow-400 font-semibold rounded-lg hover:bg-yellow-500 transition"
            >
                Buscar
            </button>

        </div>

        <!-- Spinner animado -->
        <div id="spinner" class="hidden flex justify-center items-center gap-3 text-slate-500 my-6 font-medium">

            <div class="w-8 h-8 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"></div>

            <span>Cargando Pokémon...</span>

        </div>

        <!-- Mensajes de error -->
        <div
            id="mensaje"
            class="hidden text-center text-red-600 font-medium my-4 p-3 bg-red-50 rounded-lg max-w-md mx-auto"
        ></div>

        <!-- Botón reintentar -->
        <div class="text-center mb-6">

            <button
                id="btn-reintentar"
                class="hidden px-5 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition"
            >
                ↻ Reintentar búsqueda
            </button>

        </div>

        <!-- Resultados -->
        <div id="resultado" class="grid grid-cols-2 md:grid-cols-4 gap-4">
        </div>

        <!-- Cargar más -->
        <div class="text-center my-6">

            <button
                id="cargar-mas"
                class="px-4 py-2 bg-slate-700 text-white rounded-lg hover:bg-slate-800 transition"
            >
                Cargar más
            </button>

        </div>

    </main>
    
<!-- Animación de captura -->
<div id="animacion-captura"
     class="hidden fixed inset-0 z-50 bg-slate-900/70 flex items-center justify-center">

    <div class="bg-white rounded-2xl shadow-2xl p-8 text-center max-w-sm w-full mx-4">

        <!-- Pokébola -->
        <div class="flex justify-center mb-6">

            <div id="pokebola"
                 class="pokebola">

                <div class="pokebola-superior"></div>
                <div class="pokebola-inferior"></div>
                <div class="pokebola-linea"></div>
                <div class="pokebola-centro"></div>

            </div>

        </div>

        <!-- Mensaje de captura -->
        <h2 id="mensaje-captura"
            class="text-xl font-bold text-slate-800">
            ¡Pokémon capturado!
        </h2>

        <p class="text-slate-500 mt-2">
            Se ha agregado a tu colección.
        </p>

    </div>

</div>


    <script src="script.js"></script>

</body>
</html>
